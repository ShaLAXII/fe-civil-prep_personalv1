 <button data-page="home"><span>⌂</span>Home</button><button data-page="library"><span>▦</span>Library</button><button data-page="practice"><span>✎</span>Practice</button><button data-page="reader"><span>▤</span>Reader</button><button data-page="sources"><span>▤</span>Books</button>
